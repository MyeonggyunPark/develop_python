<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page_title }} | Agent Platform</title>
  <link rel="stylesheet" href="{{ request.url_for('static', path='app.css') }}">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="sidebar-top">
        <div class="brand">
          <div class="brand-mark">AP</div>
          <div>
            <div class="brand-title">Agent Platform</div>
            <div class="brand-subtitle">Multi-Agent Ops Console</div>
          </div>
        </div>
        <div class="nav-section-title">Main</div>
        <nav class="nav">
          <a class="nav-link {% if active_nav == 'dashboard' %}is-active{% endif %}" href="/">
            <span class="nav-icon">◫</span>
            <span>Dashboard</span>
          </a>
          <a class="nav-link {% if active_nav == 'agents' %}is-active{% endif %}" href="/agents">
            <span class="nav-icon">◇</span>
            <span>Agents</span>
          </a>
          <a class="nav-link {% if active_nav == 'costs' %}is-active{% endif %}" href="/costs">
            <span class="nav-icon">◌</span>
            <span>Costs</span>
          </a>
          <a class="nav-link {% if active_nav == 'settings' %}is-active{% endif %}" href="/settings">
            <span class="nav-icon">▣</span>
            <span>Settings</span>
          </a>
        </nav>
      </div>
      <div class="sidebar-footer">
        <a class="button sidebar-button" href="/agents">+ New Agent</a>
        <div class="support-card">
          <div class="support-title">Quick Note</div>
          <div class="support-text">새 자동화 에이전트는 Agents 화면에서 등록하고 상세 페이지에서 실행합니다.</div>
        </div>
      </div>
    </aside>
    <main class="content">
      <header class="page-header">
        <div class="page-title-block">
          <h1>{{ page_title }}</h1>
          <p class="muted">등록된 자동화 에이전트를 운영하기 위한 내부 콘솔입니다.</p>
        </div>
        <div class="header-actions">
          <label class="search-box">
            <span class="search-icon">⌕</span>
            <input type="text" placeholder="Search agents, run IDs, settings">
          </label>
          <span class="icon-button" aria-hidden="true">⟳</span>
          <span class="icon-button" aria-hidden="true">◌</span>
          <span class="pill">Last 7 days</span>
        </div>
      </header>
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
